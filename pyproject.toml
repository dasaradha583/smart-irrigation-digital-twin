[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irrigation-twin"
version = "0.1.0"
description = "Digital twin coupling a small water distribution network with farm soil-moisture models."
requires-python = ">=3.10"
dependencies = [
    "wntr>=1.2",
    "numpy",
    "pandas",
    "matplotlib",
    "networkx",
    "scikit-learn",
]

[project.optional-dependencies]
dashboard = ["streamlit", "plotly"]

dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
